<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="羅賓漢射氣球：橫向手機射箭小遊戲，五階蓄力、風雷光特效、十環標靶、共 10 關。">
<meta name="theme-color" content="#15301f">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="射氣球">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>羅賓漢射氣球</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --sky:#1b2f4f; --ground:#15301f; --wood:#6b3f1f; --parchment:#f2e3c0; --ink:#2a1d12;
    --font-ui:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    --font-num:'Cinzel','Noto Sans TC',Georgia,serif;
  }
  html,body{height:100%;}
  body{margin:0;background:var(--ground);color:var(--parchment);font-family:var(--font-ui);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 60%,#1f4030 0%,#0f2318 70%);}
  canvas{display:block;touch-action:none;border-radius:6px;box-shadow:0 0 0 2px #3a2a18,0 18px 50px rgba(0,0,0,.55);}
  #rotate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(10,20,14,.92);text-align:center;padding:24px 16px;z-index:10;}
  #rotate[hidden]{display:none;}
  #rotate .phone{width:46px;height:82px;border:3px solid var(--parchment);border-radius:8px;animation:turn 1.6s ease-in-out infinite;}
  @keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-90deg)}}
  #rotate h2{margin:0;font-weight:900;font-size:22px;letter-spacing:.06em;}
  #rotate p{margin:0;opacity:.8;max-width:30ch;line-height:1.6;}
  #rotate button{font:700 16px var(--font-ui);padding:10px 22px;border-radius:999px;border:2px solid var(--parchment);
    background:transparent;color:var(--parchment);}
  #rotate button:focus-visible{outline:3px solid #f3c53d;outline-offset:2px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="羅賓漢射氣球遊戲畫面"></canvas></div>
<div id="rotate" hidden>
  <div class="phone"></div>
  <h2>請將手機轉為橫向</h2>
  <p>這個遊戲是橫向設計的，橫著拿螢幕才看得到整片森林。</p>
  <button id="rotateOk" type="button">仍要直著玩</button>
</div>
<script>
'use strict';
(function(){
const W=960, H=540;
const PLAY_B=466;                 // 遊戲區底邊；以下是控制列（技能、技能珠、放箭按鈕）
const RS=2/3;                     // 羅賓漢縮放比例
const RX=96, RY0=282, RY_MIN=52+82*RS, RY_MAX=PLAY_B-66*RS; // 羅賓漢可上下拖移的範圔（腳不會踩進控制列）
const ZONE={x0:330, x1:915};
const BR={rx:20, ry:25};
const TG={x:W-78, R:33};
const BTN={x:W-64, y:H-37, r:30};
const START_ARROWS=20, LEVEL_ARROWS=10, LEVELS=21, ARROW_PRICE=100, ORBS=5, MAX_HP=10;
// 最終關永遠是最後一關（之後在前面加關卡時只要調 LEVELS 與各段起點即可）
const BOSS={hp:10, x:W-RX, attackEvery:3, skillEvery:3, score:1000, hitScore:50, rx:20, ry:34};
// 第 11 關起：燃燒的森林與山賊
const BANDIT_FROM=11;
const BANDIT_FRONT=Math.round(W*3/5);   // 山賊最前線：從右側算起 2/5 的遊玩區寬度，再往前不會越過
const BANDIT={score:100, rx:17, ry:30, x0:BANDIT_FRONT, x1:900, yMin:130, yMax:PLAY_B-56, spawnEvery:5, start:2, reloadMin:3, reloadMax:5, step:60};
const BLADE={score:20, r:15};
const WISP_FROM=16;
// 敵人類型：11–15 山賊（燃燒的森林）、16–20 鬼火（火熄後的灰燼森林）
const ENEMY={
  bandit:{name:'山賊', unit:'名', scene:'燃燒的森林', speeds:[0], moveSpeed:lv=>COLORS.red.speed*(1+.06*(lv-1))/2, hitR:BANDIT.ry},
  wisp:  {name:'鬼火', unit:'隻', scene:'灰燼森林',   speeds:[0,1], moveSpeed:lv=>COLORS.blue.speed*(1+.06*(lv-1)),  hitR:22},
  boss:  {name:'幻影羅賓漢', unit:'', scene:'月夜的雪伍德', speeds:[0,1,2], moveSpeed:lv=>COLORS.green.speed*(1+.06*(lv-1)), hitR:34},
};
const SPEED_TABLE=[640,860,1100,1400,1800];                          // 舊五階射速表，供敵人投射物取速
function enemyKind(lv){ return lv===LEVELS?'boss':(lv>=WISP_FROM?'wisp':(lv>=BANDIT_FROM?'bandit':null)); }
function isBanditLevel(lv){ return enemyKind(lv)!==null; }           // 廣義：有敵人的關卡
function blockIndex(lv){ return lv>=WISP_FROM?lv-WISP_FROM:lv-BANDIT_FROM; }
function banditTotal(lv){ return 10+3*blockIndex(lv); }              // 每段第 1 關 10，之後每關 +3
function banditCap(lv){ return blockIndex(lv)<=1?3:4; }              // 每段前兩關 3，之後 4
function banditMoveSpeed(lv){ return ENEMY[enemyKind(lv)].moveSpeed(lv); }
const ARROW_W=8; // 一支箭的視覺寬度（含箭羽），雷技能判定以此為單位

const COLORS={
  red:   {fill:'#e0453b', light:'#ff9d90', speed:60,  score:10, name:'紅'},
  blue:  {fill:'#3f7fd6', light:'#a3caff', speed:90,  score:20, name:'藍'},
  green: {fill:'#4caf5a', light:'#b0ecac', speed:120, score:30, name:'綠'},
  yellow:{fill:'#f3c53d', light:'#fff3b3', speed:165, score:50, name:'黃'},
};
const STAGES=[
  {speed:640,  name:'輕射', color:'#e9e2cf'},
  {speed:860,  name:'穩射', color:'#e9e2cf'},
  {speed:1100, name:'強射', color:'#ffd27a'},
];
const STAGE_T=[0, .35, .75];
const SKILLS={
  wind:   {name:'風', color:'#5ee07a', light:'#c8ffd2', x:58,  speed:1400, desc:'三箭齊發'},
  thunder:{name:'雷', color:'#5aa9ff', light:'#dff0ff', x:104, speed:1800, desc:'判定加寬'},
  light:  {name:'光', color:'#ffe066', light:'#fff8d0', x:150, speed:Infinity, desc:'瞬間貫穿'},
};
const SKILL_KEYS=['wind','thunder','light'];
const SK_Y=H-46, SK_R=15, ORB_Y=H-14;

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
if(!ctx.roundRect){ ctx.roundRect=function(x,y,w,h,r){ r=Math.min(r,w/2,h/2); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); }; }
const rotateEl=document.getElementById('rotate');
let rotateDismissed=false;
document.getElementById('rotateOk').addEventListener('click',()=>{rotateDismissed=true; rotateEl.hidden=true;});

function resize(){
  const vw=innerWidth, vh=innerHeight;
  const s=Math.min(vw/W, vh/H);
  cv.style.width=Math.floor(W*s)+'px';
  cv.style.height=Math.floor(H*s)+'px';
  const dpr=Math.min(devicePixelRatio||1, 2);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  rotateEl.hidden = !(vh>vw*1.05) || rotateDismissed;
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize,150));
resize();

/* ---------- audio ---------- */
let AC=null, muted=false;
try{ muted = localStorage.getItem('robin_muted')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==='suspended'){ AC.resume().catch(()=>{}); } return AC; }
function tone(freq0,freq1,dur,type,gain){
  const a=ac(); if(!a||muted) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=type; o.frequency.setValueAtTime(freq0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,freq1),t+dur);
  g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const sfx={
  pop(){ tone(700,120,.13,'square',.12); },
  shoot(stage){ tone(260+stage*60,70,.18,'sawtooth',.07); },
  charge(stage){ tone(320+stage*110,360+stage*110,.08,'triangle',.06); },
  ring(ring){ tone(440,440+ring*40,.12,'triangle',.1); setTimeout(()=>tone(660,660+ring*60,.25,'triangle',.1),110); },
  buy(){ tone(520,780,.12,'triangle',.08); },
  over(){ tone(300,90,.6,'sawtooth',.1); },
  win(){ [0,120,240,420].forEach((d,i)=>setTimeout(()=>tone(523*[1,1.25,1.5,2][i],523*[1,1.25,1.5,2][i],.3,'triangle',.1),d)); },
};

/* ---------- state ---------- */
const G={
  state:'title', level:1, score:0, arrows:START_ARROWS, time:0,
  balloons:[], flying:[], particles:[], popups:[], beams:[], target:null, stuck:null,
  charging:false, chargeT:0, stage:0, result:null, resultT:0, levelIntroT:0,
  best:null, newRecord:false, ambient:[], gameOverReason:'', gameOverTitle:'',
  hp:MAX_HP, hurtT:0,
  bandits:[], blades:[], pool:0, spawnT:0,
  boss:null, ghostArrows:[],
  startLevel:1, testRun:false,
  orbs:ORBS, armed:null, ry:RY_MAX, drag:null, chargeId:null,   // 標題畫面先站在地面，避免擋到說明文字
};
function AY(){ return G.ry-10*RS; }   // 箭的水平射線高度（隨羅賓漢縮放）
function refillOrbs(){ G.orbs=ORBS; }
// 測試用：網址加 ?level=N 可從第 N 關開始；標題畫面左下也有選關鈕。非從第 1 關開始的回合不登錄紀錄。
try{ const q=parseInt(new URLSearchParams(location.search).get('level'),10); if(q>=1 && q<=LEVELS) G.startLevel=q; }catch(e){}
try{ const b=localStorage.getItem('robin_best'); if(b) G.best=JSON.parse(b); }catch(e){}
function saveBest(){ try{ localStorage.setItem('robin_best', JSON.stringify(G.best)); }catch(e){} }

function rnd(a,b){ return a+Math.random()*(b-a); }
function pick(){ const r=Math.random(); return r<.42?'blue':(r<.78?'green':'yellow'); }
function fmtTime(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+(r<10?'0':'')+r; }

function makeBalloon(color,x,y,lv,swayable){
  const c=COLORS[color];
  return {color, x, y, rx:BR.rx, ry:BR.ry, speed:c.speed*(1+.06*(lv-1)), score:c.score,
    phase:rnd(0,Math.PI*2), swayAmp: swayable?rnd(4,10):0, sway:0};
}
function spawnLevel(lv){
  G.bandits=[]; G.blades=[]; G.pool=0; G.boss=null; G.ghostArrows=[];
  if(enemyKind(lv)==='boss'){
    G.balloons=[]; G.target=null; G.stuck=null; G.levelIntroT=2.2;
    G.boss={x:BOSS.x, y:RY0, hp:BOSS.hp, t:BOSS.attackEvery+1.5, count:0, mv:0, ty:RY0, pause:1.2, flash:0, bob:0};
    return;
  }
  if(isBanditLevel(lv)){
    G.balloons=[]; G.target=null; G.stuck=null; G.levelIntroT=1.8;
    G.pool=banditTotal(lv);
    for(let i=0;i<BANDIT.start;i++) spawnBandit();
    G.spawnT=BANDIT.spawnEvery;
    return;
  }
  const count=10+5*(lv-1);
  const P=PLAY_B+BR.ry*2+10;
  let reds=Math.max(3, Math.round(count*.3));
  const rows=Math.ceil(reds/8);
  const list=[];
  let left=reds;
  for(let r=0;r<rows;r++){
    const n=Math.min(8,left); left-=n;
    const gap=(ZONE.x1-ZONE.x0)/(n+1);
    const y=PLAY_B+BR.ry+ r*(P/rows);
    for(let i=0;i<n;i++) list.push(makeBalloon('red', ZONE.x0+gap*(i+1), y, lv, false));
  }
  for(let i=0;i<count-reds;i++){
    list.push(makeBalloon(pick(), rnd(ZONE.x0+BR.rx, ZONE.x1-BR.rx), rnd(BR.ry+60, PLAY_B+P-BR.ry), lv, true));
  }
  G.balloons=list; G.target=null; G.stuck=null; G.levelIntroT=1.8;
}
function startGame(){
  G.level=G.startLevel; G.testRun=G.startLevel>1;
  G.score=0; G.arrows=START_ARROWS; G.hp=MAX_HP; G.hurtT=0; G.time=0; G.flying=[]; G.particles=[]; G.popups=[]; G.beams=[];
  G.charging=false; G.chargeT=0; G.stage=0; G.newRecord=false; G.result=null; G.armed=null; G.ry=RY0; G.drag=null; refillOrbs();
  spawnLevel(G.level); G.state='play';
  if(G.testRun) addPopup(W/2, H/2+40, '測試模式：從第 '+G.level+' 關開始，本回合不登錄紀錄', '#ffb35c', 2.5, 18);
  if(canFS && !isFS() && !isStandalone()) enterFS();
}
function nextLevel(){
  G.level++; G.arrows+=LEVEL_ARROWS; G.flying=[]; G.beams=[]; G.result=null; refillOrbs();
  const healed=G.hp<MAX_HP; G.hp=Math.min(MAX_HP, G.hp+1);
  addPopup(W/2, H/2-40, '補充 '+LEVEL_ARROWS+' 支箭 ・ 技能珠補滿'+(healed?' ・ 血量 +1':''), '#ffe066', 1.6, 26);
  spawnLevel(G.level); G.state='play';
}
function segmentHitsBalloon(b, x0,y0, x1,y1, halfH){
  // 把橢圓在 y 方向壓成圓，再算線段到圓心的最短距離
  const bx=b.x+b.sway, by=b.y, k=b.rx/b.ry;
  const px0=x0-bx, py0=(y0-by)*k, px1=x1-bx, py1=(y1-by)*k;
  const dx=px1-px0, dy=py1-py0, L2=dx*dx+dy*dy;
  let t=L2>0?-(px0*dx+py0*dy)/L2:0; t=Math.max(0,Math.min(1,t));
  const cx=px0+dx*t, cy=py0+dy*t;
  const r=b.rx+(halfH||0)*k;
  return cx*cx+cy*cy<=r*r;
}
function addPopup(x,y,text,color,life,size){ G.popups.push({x,y,text,color,life:life||1,t:0,size:size||20}); }
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), sp=rnd(80,260);
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rnd(.4,.8),t:0,color,r:rnd(2,5)});
  }
}

/* ---------- input ---------- */
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
const startBtn={x:W/2-120, y:H-118, w:240, h:58};
const muteBtn={x:W-46, y:6, w:40, h:32};
const fsBtn={x:W-172, y:H-58, w:150, h:40};
const lvDec={x:22, y:H-58, w:40, h:40}, lvInc={x:150, y:H-58, w:40, h:40};   // 標題畫面的選關鈕（測試用）

/* ---------- fullscreen / standalone ---------- */
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isIPhone=/iPhone|iPod/.test(navigator.userAgent);
function isStandalone(){ try{ return navigator.standalone===true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches; }catch(e){ return false; } }
function isFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
const canFS = !isIPhone && !!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function enterFS(){
  try{
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!req) return;
    const r=req.call(el,{navigationUI:'hide'});
    if(r&&r.then) r.then(()=>{ try{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }).catch(()=>{});
  }catch(e){}
}
function exitFS(){ try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(e){} }
function toggleFS(){ isFS()?exitFS():enterFS(); }

function ensureArrow(){
  if(G.arrows>0) return true;
  if(G.score>=ARROW_PRICE){ G.score-=ARROW_PRICE; G.arrows=1; sfx.buy(); addPopup(W-80, 72, '-100 分 → 1 支箭', '#ffb35c', 1.4, 18); return true; }
  addPopup(W/2, H/2, '沒有箭了，分數也不足 100', '#ff8a7a', 1.2, 22); return false;
}
function beginCharge(){
  if(G.state!=='play'||G.charging) return false;
  if(!ensureArrow()) return false;
  G.charging=true; G.chargeT=0; G.stage=0; sfx.charge(0);
  return true;
}
function spawnArrow(x,y,ang,v,opts){
  opts=opts||{};
  G.flying.push({x, y, ang, v, len:50, hits:0, t:0, stage:opts.stage||0, fx:opts.fx||null, halfH:opts.halfH||0});
}
function fire(){
  if(!G.charging) return;
  G.charging=false; G.chargeId=null;
  if(G.state!=='play') return;
  if(G.arrows<=0) return;
  G.arrows--;
  const hx=RX+30*RS, sx=hx-24*RS*Math.min(1,G.chargeT/STAGE_T[STAGE_T.length-1]);
  const k=G.armed;
  if(k && G.orbs>0){
    // 附魔射擊：消耗 1 顆共用技能珠，速度由技能決定
    G.orbs--; G.armed=null;
    const sk=SKILLS[k];
    if(k==='wind'){
      for(const deg of [0,-15,15]) spawnArrow(sx, AY(), deg*Math.PI/180, sk.speed, {fx:'wind'});
      sfx.shoot(3);
    } else if(k==='thunder'){
      spawnArrow(sx, AY(), 0, sk.speed, {fx:'thunder', halfH:ARROW_W}); // 上下各 +0.5 箭寬 → 總計 2 箭寬
      sfx.shoot(4);
    } else if(k==='light'){
      lightBeam(hx);
    }
  } else {
    spawnArrow(sx, AY(), 0, STAGES[G.stage].speed, {stage:G.stage});
    sfx.shoot(G.stage);
  }
  G.chargeT=0; G.stage=0;
}
function armSkill(k){
  // 按下技能只是「附魔」下一箭；再按一次取消、按別的技能則切換。拉弓期間也可以操作。
  if(G.state!=='play') return;
  const sk=SKILLS[k];
  if(G.armed===k){ G.armed=null; tone(420,260,.1,'triangle',.06); return; }
  if(G.orbs<=0){ tone(200,120,.12,'square',.05); return; }
  G.armed=k; tone(500,500+SKILL_KEYS.indexOf(k)*120,.12,'triangle',.07);
}
function popBalloon(i, arrowLike, atX){
  const b=G.balloons[i]; const bx=atX!==undefined?atX:(b.x+b.sway);
  G.balloons.splice(i,1);
  arrowLike.hits++;
  const gain=b.score, bonus=arrowLike.hits>1?20*(arrowLike.hits-1):0;
  G.score+=gain+bonus;
  burst(bx,b.y,COLORS[b.color].fill,12);
  addPopup(bx, b.y-30, '+'+gain, COLORS[b.color].light, 1, 22);
  if(bonus) addPopup(bx, b.y-58, '連穿 ×'+arrowLike.hits+'  +'+bonus, '#ffe066', 1.3, 20);
  sfx.pop();
}
function hitTarget(yc, ang, fx){
  const dist=Math.abs(yc-G.target.y);
  const ring=Math.max(1, 10-Math.floor(dist/(TG.R/10)));
  const reward=ring*50;
  G.score+=reward;
  G.stuck={y:yc, ang:ang, fx:fx};
  G.target.vy=0;
  G.result={ring, reward}; G.resultT=2.4;
  burst(TG.x, yc, ring>=9?'#f4c430':(ring>=7?'#d9403a':'#e8e0c8'), 18);
  sfx.ring(ring);
  G.state='result';
}
function damageRobin(n){
  // 羅賓漢受到攻擊：扣血、閃紅，歸零即結束遊戲。供之後關卡的敵人／障礙呼叫。
  if(G.state!=='play') return;
  n=n||1;
  G.hp=Math.max(0, G.hp-n); G.hurtT=.5;
  addPopup(RX+30, G.ry-70*RS, '-'+n, '#ff6b5c', 1, 24);
  burst(RX, G.ry, '#e0453b', 10);
  tone(180,60,.25,'sawtooth',.12);
  if(G.hp<=0){
    G.charging=false; G.chargeId=null; G.drag=null;
    G.state='gameover'; G.gameOverTitle='羅賓漢倒下了'; G.gameOverReason='血量歸零。';
    sfx.over();
  }
}
function spawnBandit(){
  if(G.pool<=0) return;
  let x=0,y=0,ok=false;
  for(let tries=0;tries<12 && !ok;tries++){
    x=rnd(BANDIT.x0,BANDIT.x1); y=rnd(BANDIT.yMin,BANDIT.yMax); ok=true;
    for(const o of G.bandits){ if(Math.hypot(o.x-x,o.y-y)<80){ ok=false; break; } }
  }
  x=Math.max(BANDIT_FRONT+BANDIT.rx, Math.min(BANDIT.x1, x));
  G.pool--;
  G.bandits.push({kind:enemyKind(G.level), x, y, state:'ready', t:rnd(1.0,2.2), appear:0, bob:rnd(0,Math.PI*2), mv:0, ty:y, pause:rnd(.5,1.5)});
  burst(x, y, enemyKind(G.level)==='wisp'?'rgba(120,220,200,.9)':'rgba(90,70,60,.9)', 8);
}
function throwBlade(b){
  const tx=RX, ty=G.ry-8*RS;                        // 瞄準羅賓漢當下的位置
  const isWisp=b.kind==='wisp';
  const sx=b.x-(isWisp?18:22), sy=b.y-(isWisp?0:12);
  const d=Math.hypot(tx-sx, ty-sy)||1;
  const stages=ENEMY[b.kind].speeds;
  const v=SPEED_TABLE[stages[Math.floor(Math.random()*stages.length)]]; // 山賊固定 1 階、鬼火 1～2 階隨機
  G.blades.push({type:isWisp?'fire':'blade', x:sx, y:sy, vx:(tx-sx)/d*v, vy:(ty-sy)/d*v, rot:Math.atan2(ty-sy, tx-sx), t:0});
  if(isWisp){ b.state='ready'; b.t=rnd(3,5); tone(300,900,.18,'sine',.06); }                 // 鬼火：每 3～5 秒吐一顆火球
  else { b.state='reload'; b.t=rnd(BANDIT.reloadMin, BANDIT.reloadMax); tone(900,300,.15,'sawtooth',.05); }
}
function killBandit(i, arrowLike){
  const b=G.bandits[i];
  G.bandits.splice(i,1);
  arrowLike.hits++;
  const gain=BANDIT.score, bonus=arrowLike.hits>1?20*(arrowLike.hits-1):0;
  G.score+=gain+bonus;
  if(b.kind==='wisp'){ burst(b.x, b.y, '#7fe8d2', 16); burst(b.x, b.y, '#dffcf5', 8); }
  else { burst(b.x, b.y, '#8a2f24', 14); burst(b.x, b.y, '#3a2a22', 8); }
  addPopup(b.x, b.y-46, '+'+gain, '#ffb35c', 1, 22);
  if(bonus) addPopup(b.x, b.y-74, '連穿 ×'+arrowLike.hits+'  +'+bonus, '#ffe066', 1.3, 20);
  tone(240,60,.22,'square',.1);
}
function destroyBlade(i, arrowLike){
  const bl=G.blades[i];
  G.blades.splice(i,1);
  arrowLike.hits++;
  const gain=BLADE.score, bonus=arrowLike.hits>1?20*(arrowLike.hits-1):0;
  G.score+=gain+bonus;
  burst(bl.x, bl.y, bl.type==='fire'?'#ff8a3a':'#ffd27a', 10);
  addPopup(bl.x, bl.y-24, '+'+gain, '#fff3b3', .9, 18);
  if(bonus) addPopup(bl.x, bl.y-48, '連穿 ×'+arrowLike.hits+'  +'+bonus, '#ffe066', 1.2, 18);
  tone(1400,500,.1,'square',.07);
}
function updateBandits(dt){
  const cap=banditCap(G.level);
  // 每 5 秒補 1 名直到上限；全滅且尚有存量時立刻補上
  G.spawnT-=dt;
  if(G.spawnT<=0){ if(G.bandits.length<cap && G.pool>0) spawnBandit(); G.spawnT=BANDIT.spawnEvery; }
  if(G.bandits.length===0 && G.pool>0){ for(let i=0;i<Math.min(BANDIT.start,G.pool, cap);i++) spawnBandit(); G.spawnT=BANDIT.spawnEvery; }
  const spd=banditMoveSpeed(G.level);
  for(const b of G.bandits){
    b.appear=Math.min(1,b.appear+dt*3);
    // 隨機上下移動：一次一格（60px），走完停一下再決定下一步
    if(b.mv===0){
      b.pause-=dt;
      if(b.pause<=0){
        const r=Math.random(), dir=r<.4?-1:(r<.8?1:0);
        const ty=Math.max(BANDIT.yMin, Math.min(BANDIT.yMax, b.y+dir*BANDIT.step));
        let free=dir!==0 && ty!==b.y;
        if(free) for(const o of G.bandits){ if(o!==b && Math.abs(o.x-b.x)<60 && Math.abs((o.mv?o.ty:o.y)-ty)<70){ free=false; break; } }
        if(free){ b.mv=dir; b.ty=ty; } else b.pause=rnd(.5,1.5);
      }
    } else {
      b.y+=b.mv*spd*dt;
      if((b.mv>0 && b.y>=b.ty)||(b.mv<0 && b.y<=b.ty)){ b.y=b.ty; b.mv=0; b.pause=rnd(.6,1.6); }
    }
    b.t-=dt;
    if(b.state==='ready'){ if(b.t<=0) throwBlade(b); }
    else if(b.t<=0){ b.state='ready'; b.t=rnd(.4,.9); }   // 山賊：拿起新刀，短暫瞄準後投出
  }
  const cx=RX, cy=G.ry-6*RS, hitR=34*RS;
  for(let i=G.blades.length-1;i>=0;i--){
    const bl=G.blades[i];
    bl.x+=bl.vx*dt; bl.y+=bl.vy*dt; bl.rot-=8*dt; bl.t+=dt;   // 大刀逆時針旋轉；火球以 t 做火焰閃動
    if(Math.hypot(bl.x-cx, bl.y-cy)<hitR+10){
      G.blades.splice(i,1);
      if(G.hurtT<=0) damageRobin(1);
      continue;
    }
    if(bl.x<-60 || bl.y<-60 || bl.y>H+60 || bl.x>W+60) G.blades.splice(i,1);
  }
}
function bossFire(){
  const b=G.boss;
  b.count++;
  const useSkill = b.count%BOSS.skillEvery===0 ? (Math.random()<.5?'wind':'thunder') : null;   // 每 3 次攻擊用一次風或雷，不會用光
  const hx=b.x-30*RS, hy=b.y-10*RS;                    // 鏡像後的弓手位置
  const tx=RX, ty=G.ry-8*RS;
  const base=Math.atan2(ty-hy, tx-hx);
  const shoot=(ang,v,fx,halfH)=>{ G.ghostArrows.push({x:hx-Math.cos(ang)*50, y:hy-Math.sin(ang)*50, ang, v, len:50, fx:fx||null, halfH:halfH||0, stage:0, ghost:true, t:0}); };
  if(useSkill==='wind'){ for(const d of [0,-15,15]) shoot(base+d*Math.PI/180, SKILLS.wind.speed, 'wind', 0); }
  else if(useSkill==='thunder'){ shoot(base, SKILLS.thunder.speed, 'thunder', ARROW_W); }
  else shoot(base, SPEED_TABLE[Math.floor(Math.random()*3)], null, 0);
  b.t=BOSS.attackEvery;
  tone(useSkill?520:260, 90, .18, 'sawtooth', .07);
}
function hurtBoss(n, hx, hy){
  const b=G.boss; if(!b) return;
  b.hp=Math.max(0,b.hp-n); b.flash=.3;
  G.score+=BOSS.hitScore;
  addPopup(hx, hy-40, '+'+BOSS.hitScore, '#d8b4ff', 1, 20);
  burst(hx, hy, '#9b6bff', 12);
  tone(700,200,.12,'square',.08);
  if(b.hp<=0){
    G.score+=BOSS.score;
    burst(b.x, b.y, '#d8b4ff', 40); burst(b.x, b.y-20, '#6b3fbf', 24);
    addPopup(b.x, b.y-80, '幻影消散  +'+BOSS.score, '#d8b4ff', 2, 28);
    G.boss=null; G.ghostArrows=[];
    tone(400,1200,.5,'triangle',.1);
    // 幻影倒下即結束遊戲，不再出標靶
    G.charging=false; G.chargeId=null;
    G.result={boss:true, reward:BOSS.score}; G.resultT=2.6;
    G.state='result';
  }
}
function updateBoss(dt){
  const b=G.boss;
  if(b){
    if(b.flash>0) b.flash-=dt;
    b.bob+=dt;
    // 與其他敵人相同的上下走位：一次一格
    const spd=ENEMY.boss.moveSpeed(G.level);
    if(b.mv===0){
      b.pause-=dt;
      if(b.pause<=0){
        const r=Math.random(), dir=r<.4?-1:(r<.8?1:0);
        const ty=Math.max(BANDIT.yMin, Math.min(BANDIT.yMax, b.y+dir*BANDIT.step));
        if(dir!==0 && ty!==b.y){ b.mv=dir; b.ty=ty; } else b.pause=rnd(.5,1.2);
      }
    } else {
      b.y+=b.mv*spd*dt;
      if((b.mv>0 && b.y>=b.ty)||(b.mv<0 && b.y<=b.ty)){ b.y=b.ty; b.mv=0; b.pause=rnd(.4,1.2); }
    }
    b.t-=dt; if(b.t<=0) bossFire();
  }
  // 幻影的箭：直線飛行，命中羅賓漢扣血
  const cx=RX, cy=G.ry-6*RS, hitR=34*RS;
  for(let i=G.ghostArrows.length-1;i>=0;i--){
    const g=G.ghostArrows[i];
    g.t+=dt;
    const c=Math.cos(g.ang), sn=Math.sin(g.ang);
    g.x+=c*g.v*dt; g.y+=sn*g.v*dt;
    const tx=g.x+c*g.len, ty=g.y+sn*g.len;
    if(Math.hypot(tx-cx, ty-cy)<hitR+8+(g.halfH||0)){
      G.ghostArrows.splice(i,1);
      if(G.hurtT<=0) damageRobin(1);
      continue;
    }
    if(g.x<-80 || g.y<-80 || g.y>H+80 || g.x>W+80) G.ghostArrows.splice(i,1);
  }
}
function lightBeam(x0){
  // 光束：瞬間貫穿整條射線，路徑上的氣球全部擊破
  const beam={hits:0};
  const order=[];
  for(let i=0;i<G.balloons.length;i++){ const b=G.balloons[i]; if(Math.abs(AY()-b.y)<=b.ry && b.x+b.sway>=x0-b.rx) order.push(i); }
  order.sort((p,q)=>(G.balloons[p].x+G.balloons[p].sway)-(G.balloons[q].x+G.balloons[q].sway));
  const targets=order.map(i=>G.balloons[i]); // 先取物件參考，再逐一移除，連穿計數由左到右
  for(const b of targets){ const i=G.balloons.indexOf(b); if(i>=0) popBalloon(i, beam); }
  const bOrder=G.bandits.filter(b=>Math.abs(AY()-b.y)<=BANDIT.ry && b.x>=x0).sort((p,q)=>p.x-q.x);
  for(const b of bOrder){ const i=G.bandits.indexOf(b); if(i>=0) killBandit(i, beam); }
  if(G.boss && Math.abs(AY()-G.boss.y)<=BOSS.ry){ beam.hits++; hurtBoss(1, G.boss.x, AY()); }
  for(let i=G.ghostArrows.length-1;i>=0;i--){ const g=G.ghostArrows[i]; const mx=g.x+Math.cos(g.ang)*25, my=g.y+Math.sin(g.ang)*25; if(Math.abs(AY()-my)<=16 && mx>=x0){ G.ghostArrows.splice(i,1); beam.hits++; G.score+=BLADE.score; burst(mx,my,'#d8b4ff',8); addPopup(mx,my-24,'+'+BLADE.score,'#e8dcff',.9,18); } }
  const blOrder=G.blades.filter(bl=>Math.abs(AY()-bl.y)<=BLADE.r && bl.x>=x0).sort((p,q)=>p.x-q.x);
  for(const bl of blOrder){ const i=G.blades.indexOf(bl); if(i>=0) destroyBlade(i, beam); }
  if(beam.hits>1) addPopup(W/2, AY()-90, '光束貫穿 ×'+beam.hits, '#fff3b3', 1.4, 26);
  G.beams.push({x0, y:AY(), t:0, life:.45});
  sfx.shoot(5); setTimeout(()=>tone(1200,1800,.2,'triangle',.08),40);
  if(G.target && G.state==='play'){
    const dist=Math.abs(AY()-G.target.y);
    if(dist<=TG.R) hitTarget(AY(), 0, 'light');
  }
}
cv.addEventListener('pointerdown', e=>{

    if(G.state==='title' && inRect(p,lvInc)){ G.startLevel=Math.min(LEVELS,G.startLevel+1); tone(500,500,.05,'triangle',.05); return; }

  }

      G.drag={id:e.pointerId, off:p.y-G.ry};
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}

});

});
addEventListener('keyup', e=>{ if(e.code==='Space' && G.chargeId==='kb') fire(); });
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* ---------- update ---------- */
function update(dt){
  const P=PLAY_B+BR.ry*2+10;
  const t=G.t;
  // ambient title balloons
  if(G.state!=='play'&&G.state!=='result'){
    if(G.ambient.length<7 && Math.random()<.02){ const c=['red','blue','green','yellow'][Math.floor(Math.random()*4)]; G.ambient.push(makeBalloon(c, rnd(ZONE.x0,ZONE.x1), PLAY_B+BR.ry, 1, true)); }
    for(const b of G.ambient){ b.y-=b.speed*.6*dt; b.sway=Math.sin(t*1.3+b.phase)*b.swayAmp; }
    G.ambient=G.ambient.filter(b=>b.y>-BR.ry);
  }
  if(G.state==='play'){
    G.time+=dt;
    if(G.levelIntroT>0) G.levelIntroT-=dt;
    if(G.charging){
      G.chargeT+=dt;
      let s=0; for(let i=0;i<STAGE_T.length;i++) if(G.chargeT>=STAGE_T[i]) s=i;
      if(s!==G.stage){ G.stage=s; sfx.charge(s); }
    }
    for(const b of G.balloons){
      b.y-=b.speed*dt;
      if(b.y<-b.ry) b.y+=P;
      b.sway=Math.sin(t*1.6+b.phase)*b.swayAmp;
    }
    if(G.target){
      const tg=G.target;
      tg.y+=tg.vy*dt;
      const top=52+TG.R, bot=PLAY_B-TG.R-4;
      if(tg.y<top){ tg.y=top; tg.vy=Math.abs(tg.vy); }
      else if(tg.y>bot && tg.vy>0){ tg.y=bot; tg.vy=-Math.abs(tg.vy); }
    }
    for(const a of G.flying){
      if(a.done) continue;
      a.t+=dt;
      const c=Math.cos(a.ang), s=Math.sin(a.ang);
      const ptx=a.x+c*a.len, pty=a.y+s*a.len;      // 上一幀箭尖
      a.x+=c*a.v*dt; a.y+=s*a.v*dt;
      const tx=a.x+c*a.len, ty=a.y+s*a.len;        // 這一幀箭尖
      // balloons：箭尖掃過的線段 vs 橢圓（含雷技能的加寬判定）
      for(let i=G.balloons.length-1;i>=0;i--){
        if(segmentHitsBalloon(G.balloons[i], ptx,pty, tx,ty, a.halfH)) popBalloon(i, a);
      }
      for(let i=G.bandits.length-1;i>=0;i--){
        const b=G.bandits[i];
        if(segmentHitsBalloon({x:b.x, sway:0, y:b.y, rx:BANDIT.rx, ry:BANDIT.ry}, ptx,pty, tx,ty, a.halfH)) killBandit(i, a);
      }
      for(let i=G.blades.length-1;i>=0;i--){
        const bl=G.blades[i];
        if(segmentHitsBalloon({x:bl.x, sway:0, y:bl.y, rx:BLADE.r, ry:BLADE.r}, ptx,pty, tx,ty, a.halfH)) destroyBlade(i, a);
      }
      // 幻影的箭：可以被射掉，但我方的箭也會一起消失（不能穿透）
      for(let i=G.ghostArrows.length-1;i>=0 && !a.dead;i--){
        const g=G.ghostArrows[i], mx=g.x+Math.cos(g.ang)*25, my=g.y+Math.sin(g.ang)*25;
        if(segmentHitsBalloon({x:mx, sway:0, y:my, rx:16, ry:16}, ptx,pty, tx,ty, a.halfH)){
          G.ghostArrows.splice(i,1); a.dead=true; a.hits++;
          const bonus=a.hits>1?20*(a.hits-1):0; G.score+=BLADE.score+bonus;
          burst(mx,my,'#d8b4ff',10); addPopup(mx,my-24,'+'+BLADE.score,'#e8dcff',.9,18);
          tone(1200,400,.1,'square',.07);
        }
      }
      // 幻影本體：命中扣 1 點血，箭停在他身上
      if(G.boss && !a.dead && segmentHitsBalloon({x:G.boss.x, sway:0, y:G.boss.y, rx:BOSS.rx, ry:BOSS.ry}, ptx,pty, tx,ty, a.halfH)){
        a.dead=true; hurtBoss(1, tx, ty);
      }
      // target：箭尖跨過靶面 x 時，取交點高度判環
      if(G.target && G.state==='play' && ptx<TG.x && tx>=TG.x){
        const yc = pty + (ty-pty)*((TG.x-ptx)/(tx-ptx||1));
        if(Math.abs(yc-G.target.y)<=TG.R){
          a.done=true; a.x=TG.x-c*a.len; a.y=yc-s*a.len;
          hitTarget(yc, a.ang, a.fx);
        }
      }
    }
    G.flying=G.flying.filter(a=>!a.dead && (a.done || (a.x<W+20 && a.y>-80 && a.y<H+80)));
    if(G.state==='play' && (G.boss||G.ghostArrows.length)) updateBoss(dt);
    if(isBanditLevel(G.level) && G.state==='play' && (G.bandits.length>0||G.pool>0)) updateBandits(dt);
    else if(G.blades.length){ updateBandits(dt); }
    for(const bm of G.beams) bm.t+=dt;
    G.beams=G.beams.filter(bm=>bm.t<bm.life);
    if(!G.target && G.balloons.length===0 && G.bandits.length===0 && G.pool===0 && !G.boss && G.state==='play'){
      G.target={y:PLAY_B+TG.R, vy:-(150+G.level*12)};
      addPopup(W/2, H/2-30, (enemyKind(G.level)==='boss'?'幻影消散！':(isBanditLevel(G.level)?ENEMY[enemyKind(G.level)].name+'全數擊退！':'氣球全部射完！'))+'標靶出現', '#ffe066', 1.6, 26);
    }
    // game over check
    if(G.state==='play' && G.arrows<=0 && !G.charging && G.flying.length===0 && G.score<ARROW_PRICE && (G.balloons.length>0||G.target||G.bandits.length>0||G.pool>0||G.boss)){
      G.state='gameover'; G.gameOverTitle='箭矢用盡';
      const left=G.bandits.length+G.pool;
      G.gameOverReason=(G.balloons.length>0?'場上還有 '+G.balloons.length+' 顆氣球':(G.boss?'幻影羅賓漢還沒被打倒':(left>0?'還有 '+left+' '+ENEMY[enemyKind(G.level)].unit+ENEMY[enemyKind(G.level)].name:'標靶還沒被射中')))+'，分數不足以換箭。';
      sfx.over();
    }
    if(G.hurtT>0) G.hurtT-=dt;
  }
  if(G.state==='result'){
    G.resultT-=dt;
    if(G.resultT<=0){
      if(G.level>=LEVELS){
        const rec={score:G.score, time:G.time, date:Date.now()};
        const b=G.best;
        if(!G.testRun && (!b || rec.score>b.score || (rec.score===b.score && rec.time<b.time))){ G.best=rec; G.newRecord=true; saveBest(); }
        G.state='victory'; sfx.win();
      } else nextLevel();
    }
  }
  for(const p of G.particles){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=380*dt; }
  G.particles=G.particles.filter(p=>p.t<p.life);
  for(const p of G.popups){ p.t+=dt; p.y-=28*dt; }
  G.popups=G.popups.filter(p=>p.t<p.life);
}

function drawWisp(b,t){

function drawFireball(bl){
  const ang=Math.atan2(bl.vy,bl.vx);

  for(let i=1;i<=6;i++){
    const f=Math.sin(bl.t*30+i*1.3)*.5+.5;
    const px=-i*11, r=10-i*1.3+f*2;

  ctx.globalAlpha=1;
  ctx.shadowColor='#ff8a3a'; ctx.shadowBlur=18;
  const g=ctx.createRadialGradient(2,-2,2,0,0,13);
  g.addColorStop(0,'#fff6d0'); g.addColorStop(.5,'#ffb03a'); g.addColorStop(1,'#e0451a');

  ctx.restore();

  const pressed=G.charging;
  const g=ctx.createRadialGradient(x-7,y-8,3,x,y,r);
  g.addColorStop(0,pressed?'#9a6535':'#b2773f'); g.addColorStop(1,pressed?'#4a2a12':'#5d3518');
  ctx.fillStyle='rgba(0,0,0,.35)'; ellipse(x+2,y+3,r,r); ctx.fill();
  ctx.fillStyle=g; ellipse(x,y,r,r); ctx.fill();
  ctx.strokeStyle='#e0b24a'; ctx.lineWidth=2; ellipse(x,y,r-3,r-3); ctx.stroke();
  // bow glyph（原尺寸的一半）
  ctx.save(); ctx.translate(x,y); ctx.scale(.5,.5);
  ctx.strokeStyle='#f2e3c0'; ctx.lineWidth=3; ctx.lineCap='round';
  const pull=G.charging?Math.min(1,G.chargeT/STAGE_T[STAGE_T.length-1]):0;
  ctx.beginPath(); ctx.moveTo(2,-26); ctx.quadraticCurveTo(18,0,2,26); ctx.stroke();
  ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(2,-26); ctx.lineTo(-8-pull*14,0); ctx.lineTo(2,26); ctx.stroke();
  ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-8-pull*14,0); ctx.lineTo(24,0); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawOverlayCard(title,color,lines,btnLabel){
  ctx.fillStyle='rgba(12,20,14,.62)'; ctx.fillRect(0,0,W,H);
  const cw=560, ch=lines.length*30+200, cx=W/2-cw/2, cy=H/2-ch/2-8;
  ctx.fillStyle='#f2e3c0'; rrect(cx,cy,cw,ch,14); ctx.fill();
  ctx.strokeStyle='#6b3f1f'; ctx.lineWidth=4; rrect(cx+8,cy+8,cw-16,ch-16,10); ctx.stroke();
  text(title, W/2, cy+52, 40, color, 'center', null, 900);
  lines.forEach((l,i)=>text(l.t, W/2, cy+104+i*30, l.s||18, l.c||'#2a1d12', 'center', l.f, l.w||500));
  startBtn.y=cy+ch-80;
  ctx.fillStyle='#2f7a2e'; rrect(startBtn.x,startBtn.y,startBtn.w,startBtn.h,29); ctx.fill();
  ctx.strokeStyle='#ffe066'; ctx.lineWidth=2; rrect(startBtn.x+3,startBtn.y+3,startBtn.w-6,startBtn.h-6,26); ctx.stroke();
  text(btnLabel, W/2, startBtn.y+startBtn.h/2+1, 22, '#fffbe8', 'center', null, 900);
}

function draw(t){
  drawBackground(t);
  if(G.state==='play'||G.state==='result'){
    for(const b of G.balloons) drawBalloon(b);
    for(const b of G.bandits){ if(b.kind==='wisp') drawWisp(b,t); else drawBandit(b,t); }
    for(const bl of G.blades){ if(bl.type==='fire') drawFireball(bl); else drawBlade(bl); }
    if(G.boss) drawPhantom(G.boss,t);
    for(const g of G.ghostArrows) drawArrowFX(g,t);
    if(G.target) drawTarget(G.target,t);
    for(const a of G.flying) if(!a.done) drawArrowFX(a,t);
    drawBeams(t);
  } else {
    for(const b of G.ambient) drawBalloon(b);
  }
  drawRobin(t);
  for(const p of G.particles){ ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.color; ellipse(p.x,p.y,p.r,p.r); ctx.fill(); }
  ctx.globalAlpha=1;
  for(const p of G.popups){ const k=p.t/p.life; ctx.globalAlpha=k<.7?1:(1-k)/.3; ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=6; text(p.text,p.x,p.y,p.size,p.color,'center',/^[+\-\d ]+$/.test(p.text)?'num':null,900); ctx.shadowBlur=0; }
  ctx.globalAlpha=1;

  if(G.state==='play'||G.state==='result'){
    if(G.hurtT>0){ ctx.fillStyle='rgba(224,69,59,'+(G.hurtT*.5)+')'; ctx.fillRect(0,0,W,H); }
    drawBar(); drawHUD(t); drawButton(t); drawSkills(t);
    if(G.levelIntroT>0 && G.state==='play'){
      const k=Math.min(1,G.levelIntroT/.5); ctx.globalAlpha=k;
      ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=14;
      text('第 '+G.level+' 關', W/2, H/2-70, 54, '#f2e3c0', 'center', null, 900);
      text(enemyKind(G.level)==='boss'?'最終關 ・ '+ENEMY.boss.scene+' ・ '+ENEMY.boss.name:(isBanditLevel(G.level)?ENEMY[enemyKind(G.level)].scene+' ・ '+ENEMY[enemyKind(G.level)].name+' '+banditTotal(G.level)+' '+ENEMY[enemyKind(G.level)].unit:(10+5*(G.level-1))+' 顆氣球'), W/2, H/2-22, 22, '#ffe066', 'center');
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }
    if(G.state==='result'&&G.result){
      const r=G.result, k=Math.min(1,(2.4-Math.min(2.4,G.resultT))/.25);
      ctx.save(); ctx.translate(W/2,H/2-30); ctx.scale(.7+.3*k,.7+.3*k); ctx.globalAlpha=k;
      ctx.fillStyle='rgba(12,20,14,.78)'; rrect(-200,-70,400,140,16); ctx.fill();
      ctx.strokeStyle=r.ring>=9?'#f4c430':'#f2e3c0'; ctx.lineWidth=3; rrect(-200,-70,400,140,16); ctx.stroke();
      if(r.boss){ ctx.strokeStyle='#d8b4ff'; rrect(-200,-70,400,140,16); ctx.stroke(); text('幻影消散', 0, -30, 34, '#e8dcff', 'center', null, 900); }
      else text(r.ring>=10?'十環！正中靶心':'第 '+r.ring+' 環', 0, -30, 34, r.ring>=9?'#ffe066':'#f2e3c0', 'center', null, 900);
      text('獎勵 +'+r.reward, 0, 14, 26, '#ffe066', 'center', 'num', 900);
      text(G.level>=LEVELS?'全部關卡完成！':'進入第 '+(G.level+1)+' 關', 0, 48, 16, 'rgba(242,227,192,.8)', 'center');
      ctx.restore();
    }
  } else if(G.state==='title'){
    ctx.fillStyle='rgba(12,20,14,.45)'; ctx.fillRect(0,0,W,H);
    ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=18;
    text('羅賓漢射氣球', W/2, 92, 62, '#f2e3c0', 'center', null, 900);
    ctx.shadowBlur=0;
    text('ROBIN HOOD · SHERWOOD BALLOONS', W/2, 138, 14, '#ffe066', 'center', 'num');
    const lines=[
      '按住右下角按鈕拉弓、放開射箭，共 3 階；按住羅賓漢可上下拖移；一箭可連穿多個目標，穿越越多加分越多。',
      '左下角技能：按一下為下一箭附魔，再按取消、按別的切換；射出時才消耗技能珠，三個技能每關共用 5 顆。',
      '風：三箭齊發（0°、±15°）　雷：極速且判定加寬為兩箭寬　光：瞬間貫穿整條射線',
      '1～10 關 氣球（紅 10・藍 20・綠 30・黃 50）　11～15 關 燃燒森林的山賊　16～20 關 灰燼森林的鬼火',
      '最終關：月夜的幻影羅賓漢，10 點血、每 3 秒放箭、每第 3 箭改用風或雷；他的箭可以射掉，但無法穿透。',
      '被擊中扣 1 血；擊倒敵人得 100 分。初始 20 箭，每關補 10 箭並回 1 血；沒箭時每 100 分換 1 支。通過全部 '+LEVELS+' 關才登錄紀錄。',
    ];
    lines.forEach((l,i)=>text(l, W/2+30, 178+i*26, 13, 'rgba(242,227,192,.92)', 'center', null, 500));
    if(G.best){
      ctx.fillStyle='rgba(242,227,192,.12)'; rrect(W/2-210,318,420,56,12); ctx.fill();
      text('最佳紀錄', W/2-170, 346, 15, '#ffe066', 'left');
      text(String(G.best.score)+' 分', W/2-40, 347, 24, '#f2e3c0', 'center', 'num', 900);
      text('用時 '+fmtTime(G.best.time), W/2+120, 347, 18, '#f2e3c0', 'center', 'num', 700);
    } else {
      text('尚無通關紀錄，成為第一位射穿雪伍德森林的人。', W/2, 346, 15, 'rgba(242,227,192,.7)', 'center');
    }
    startBtn.y=H-118;
    // 選關（測試用）
    ctx.save();
    ctx.fillStyle='rgba(12,20,14,.55)'; rrect(lvDec.x,lvDec.y,lvInc.x+lvInc.w-lvDec.x,40,20); ctx.fill();
    ctx.strokeStyle='rgba(242,227,192,.6)'; ctx.lineWidth=1.5; rrect(lvDec.x,lvDec.y,lvInc.x+lvInc.w-lvDec.x,40,20); ctx.stroke();
    text('◀', lvDec.x+20, lvDec.y+21, 16, G.startLevel>1?'#f2e3c0':'rgba(242,227,192,.3)', 'center');
    text('▶', lvInc.x+20, lvInc.y+21, 16, G.startLevel<LEVELS?'#f2e3c0':'rgba(242,227,192,.3)', 'center');
    text('起始 第 '+G.startLevel+' 關', (lvDec.x+lvInc.x+lvInc.w)/2, lvDec.y+21, 14, G.startLevel>1?'#ffb35c':'#f2e3c0', 'center', null, 700);
    ctx.restore();
    ctx.fillStyle='#2f7a2e'; rrect(startBtn.x,startBtn.y,startBtn.w,startBtn.h,29); ctx.fill();
    ctx.strokeStyle='#ffe066'; ctx.lineWidth=2; rrect(startBtn.x+3,startBtn.y+3,startBtn.w-6,startBtn.h-6,26); ctx.stroke();
    text('開始遊戲', W/2, startBtn.y+startBtn.h/2+1, 24, '#fffbe8', 'center', null, 900);
    let hint='橫向遊玩最佳';
    if(!isStandalone()){
      if(isIPhone) hint='想隱藏網址列：在 Safari 點「分享」→「加入主畫面」，從主畫面開啟即為全螢幕';
      else if(isIOS) hint='想隱藏網址列：點右下「全螢幕」，或以「加入主畫面」安裝後開啟';
      else if(canFS) hint='開始遊戲會自動進入全螢幕；也可先點右下「全螢幕」';
    }
    text(hint, W/2-(canFS?70:0), H-40, 13, 'rgba(242,227,192,.65)', 'center');
  } else if(G.state==='gameover'){
    drawOverlayCard(G.gameOverTitle||'遊戲結束', '#b83a2e', [
      {t:G.gameOverReason},
      {t:'抵達第 '+G.level+' 關 ・ 用時 '+fmtTime(G.time), s:18},
      {t:String(G.score)+' 分', s:34, c:'#6b3f1f', f:'num', w:900},
      {t:'紀錄僅在通過全部 '+LEVELS+' 關時登錄。', s:14, c:'#6b5a44'},
    ], '再試一次');
  } else if(G.state==='victory'){
    const lines=[
      {t:'氣球全數射落，山賊、鬼火與幻影都已從雪伍德森林散去。'},
      {t:String(G.score)+' 分 ・ 用時 '+fmtTime(G.time), s:30, c:'#6b3f1f', f:'num', w:900},
    ];
    if(G.testRun) lines.push({t:'測試模式（從第 '+G.startLevel+' 關開始），不登錄紀錄。', s:14, c:'#6b5a44'});
    else if(G.newRecord) lines.push({t:'新紀錄！', s:22, c:'#b8860b', w:900});
    else if(G.best) lines.push({t:'最佳紀錄：'+G.best.score+' 分 ・ '+fmtTime(G.best.time)+'（同分以用時較短者為準）', s:15, c:'#6b5a44'});
    drawOverlayCard('全數通關', '#2f7a2e', lines, '再玩一次');
  }
  if(G.state!=='play'&&G.state!=='result'){ drawMuteOnly(); if(canFS) drawFSButton(); }
}
function drawFSButton(){
  const b=fsBtn, fs=isFS();
  ctx.save();
  ctx.fillStyle='rgba(12,20,14,.55)'; rrect(b.x,b.y,b.w,b.h,20); ctx.fill();
  ctx.strokeStyle='rgba(242,227,192,.6)'; ctx.lineWidth=1.5; rrect(b.x,b.y,b.w,b.h,20); ctx.stroke();
  // corner-bracket glyph
  const gx=b.x+16, gy=b.y+11, s=18, k=6;
  ctx.strokeStyle='#f2e3c0'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath();
  if(!fs){
    ctx.moveTo(gx,gy+k); ctx.lineTo(gx,gy); ctx.lineTo(gx+k,gy);
    ctx.moveTo(gx+s-k,gy); ctx.lineTo(gx+s,gy); ctx.lineTo(gx+s,gy+k);
    ctx.moveTo(gx+s,gy+s-k); ctx.lineTo(gx+s,gy+s); ctx.lineTo(gx+s-k,gy+s);
    ctx.moveTo(gx+k,gy+s); ctx.lineTo(gx,gy+s); ctx.lineTo(gx,gy+s-k);
  } else {
    ctx.moveTo(gx+k,gy); ctx.lineTo(gx+k,gy+k); ctx.lineTo(gx,gy+k);
    ctx.moveTo(gx+s-k,gy); ctx.lineTo(gx+s-k,gy+k); ctx.lineTo(gx+s,gy+k);
    ctx.moveTo(gx+s,gy+s-k); ctx.lineTo(gx+s-k,gy+s-k); ctx.lineTo(gx+s-k,gy+s);
    ctx.moveTo(gx,gy+s-k); ctx.lineTo(gx+k,gy+s-k); ctx.lineTo(gx+k,gy+s);
  }
  ctx.stroke();
  text(fs?'離開全螢幕':'全螢幕', b.x+b.w/2+12, b.y+b.h/2+1, 15, '#f2e3c0', 'center', null, 700);
  ctx.restore();
}
function drawMuteOnly(){
  ctx.fillStyle='rgba(242,227,192,.7)';
  ctx.beginPath(); ctx.moveTo(muteBtn.x+8,muteBtn.y+11); ctx.lineTo(muteBtn.x+14,muteBtn.y+11); ctx.lineTo(muteBtn.x+22,muteBtn.y+5); ctx.lineTo(muteBtn.x+22,muteBtn.y+27); ctx.lineTo(muteBtn.x+14,muteBtn.y+21); ctx.lineTo(muteBtn.x+8,muteBtn.y+21); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(242,227,192,.7)'; ctx.lineWidth=2;
  if(muted){ ctx.beginPath(); ctx.moveTo(muteBtn.x+26,muteBtn.y+11); ctx.lineTo(muteBtn.x+36,muteBtn.y+21); ctx.moveTo(muteBtn.x+36,muteBtn.y+11); ctx.lineTo(muteBtn.x+26,muteBtn.y+21); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(muteBtn.x+24,muteBtn.y+16,6,-1,1); ctx.stroke(); ctx.beginPath(); ctx.arc(muteBtn.x+24,muteBtn.y+16,11,-1,1); ctx.stroke(); }
}

/* ---------- loop ---------- */
let last=performance.now(); G.t=0;
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  G.t+=dt;
  update(dt); draw(G.t);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G.charging) fire(); last=performance.now(); });
requestAnimationFrame(frame);
})();
</script>
